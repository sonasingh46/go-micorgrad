name: Release
on:
  push:
    branches:
      - "releases/**"

permissions:
  contents: read

jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Extract build info
        id: extract_build_info
        run: echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Create draft like merge-to-main
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9
        with:
          commitish: main
          publish: false

      - name: Tag Release
        env:
          TAG: ${{ steps.extract_build_info.outputs.tag }}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Start proxy that fails the release update
        run: |
          pipx install mitmproxy > /dev/null
          echo empty > /tmp/mode
          nohup mitmdump -q --listen-port 8080 -s .github/test/fail_release_patch.py > /tmp/mitm.log 2>&1 &
          for i in $(seq 30); do [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ] && break; sleep 1; done
          ls -l ~/.mitmproxy/mitmproxy-ca-cert.pem

      - name: Publish Release Notes (502, empty body)
        id: empty_body
        continue-on-error: true
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9
        env:
          HTTPS_PROXY: http://127.0.0.1:8080
          NODE_USE_ENV_PROXY: "1"
          NODE_EXTRA_CA_CERTS: /home/runner/.mitmproxy/mitmproxy-ca-cert.pem
        with:
          commitish: ${{ github.ref }}
          tag: ${{ steps.extract_build_info.outputs.tag }}
          name: ${{ steps.extract_build_info.outputs.tag }}
          publish: true

      - name: Switch proxy to a JSON error body
        run: echo json > /tmp/mode

      - name: Publish Release Notes (502, JSON body)
        id: json_body
        continue-on-error: true
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9
        env:
          HTTPS_PROXY: http://127.0.0.1:8080
          NODE_USE_ENV_PROXY: "1"
          NODE_EXTRA_CA_CERTS: /home/runner/.mitmproxy/mitmproxy-ca-cert.pem
        with:
          commitish: ${{ github.ref }}
          tag: ${{ steps.extract_build_info.outputs.tag }}
          name: ${{ steps.extract_build_info.outputs.tag }}
          publish: true

      - name: Show what the proxy answered
        if: always()
        env:
          EMPTY: ${{ steps.empty_body.outcome }}
          JSON: ${{ steps.json_body.outcome }}
        run: |
          echo "empty body step: ${EMPTY}, json body step: ${JSON}"
          cat /tmp/mitm.log
